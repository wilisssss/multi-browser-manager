name: Release

# Trigger: push tag v* (mis. `git tag v0.1.0 && git push origin v0.1.0`),
# atau manual dari tab Actions (workflow_dispatch).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# tauri-action butuh izin menulis release ke repo ini.
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Dependensi build Tauri v2 di Ubuntu (WebKitGTK 4.1 + appindicator)
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Jalankan linuxdeploy tanpa FUSE (aman untuk runner tanpa libfuse2)
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Kunci signing updater (repo Settings → Secrets and variables → Actions)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Multi Browser Manager ${{ github.ref_name }}"
          releaseBody: "Lihat aset di bawah: AppImage (portable + updater), .deb (install), dan latest.json untuk auto-updater."
          releaseDraft: false
          prerelease: false

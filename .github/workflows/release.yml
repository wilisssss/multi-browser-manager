name: Release

# Trigger: push tag v* (mis. `git tag v0.2.0 && git push origin v0.2.0`).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git nodejs npm rust \
            webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg dbus zstd

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Build package
        run: ./scripts/build-arch-pkg.sh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Multi Browser Manager ${{ github.ref_name }}
          body: "Install di Arch Linux: `sudo pacman -U multi-browser-manager-*.pkg.tar.zst`"
          files: release/*.pkg.tar.zst

[package]
name = "multi-browser-manager"
version = "0.3.2"
description = "Manage multiple isolated Chromium browser profiles from one dashboard"
authors = ["MBM"]
edition = "2021"

[lib]
name = "mbm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the frontend (dist/) into the binary for standalone builds.
# `npm run tauri build` enables this automatically; for a standalone debug
# binary use: cargo build --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
which = "6"
directories = "5"
keyring = { version = "3", features = ["sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["socks", "json", "rustls-tls"] }
thiserror = "1"
notify-rust = "4"
percent-encoding = "2"
url = "2"
# Chrome DevTools Protocol client (local ws:// only, no TLS needed).
tokio-tungstenite = "0.30"
futures-util = "0.3"
# Encrypted backup export (feature): argon2id KDF + AES-256-GCM.
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
getrandom = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[package]
name = "multi-browser-manager"
version = "0.1.1"
description = "Manage multiple isolated Chromium browser profiles from one dashboard"
authors = ["MBM"]
edition = "2021"

[lib]
name = "mbm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Embeds the frontend (dist/) into the binary for standalone builds.
# `npm run tauri build` enables this automatically; for a standalone debug
# binary use: cargo build --features custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
which = "6"
directories = "5"
keyring = { version = "3", features = ["sync-secret-service"] }
reqwest = { version = "0.12", default-features = false, features = ["socks", "json", "rustls-tls", "http2"] }
thiserror = "1"
anyhow = "1"
notify-rust = "4"
percent-encoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
